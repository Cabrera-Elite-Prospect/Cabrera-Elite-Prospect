<title>Cabrera Elite Baseball Development — Mantenimiento / Maintenance</title>
<meta name="description" content="Estamos mejorando el sitio. Volvemos pronto. / We are improving the site. Back soon.">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{ --ink:#0B0A0F; --purple-deep:#241638; --purple:#5B3A96; --gold:#C9A15A; --gold-2:#E4C07C; --cream:#F1EEE4; --line:rgba(241,238,228,0.14); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; }
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px;
    background: radial-gradient(900px 480px at 82% -10%, rgba(91,58,150,0.35), transparent 60%), linear-gradient(180deg, var(--ink) 0%, var(--purple-deep) 160%);
    background-attachment: fixed; color:var(--cream);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing:antialiased; text-align:center;
  }
  .card{ max-width:560px; width:100%; }
  .logo{ width:96px; height:96px; border-radius:50%; object-fit:cover; border:1.5px solid rgba(228,192,124,0.45); margin:0 auto 22px; display:block; }
  .brand{ font-size:14px; letter-spacing:1.5px; color:var(--gold-2); font-weight:700; margin-bottom:18px; }
  h1{ font-family:'Bebas Neue','Inter',sans-serif; font-weight:400; letter-spacing:.5px; line-height:.98; font-size:clamp(44px,11vw,72px); margin:0 0 16px; }
  p{ font-size:16px; line-height:1.6; color:rgba(241,238,228,0.75); margin:0 0 10px; }
  .en{ font-size:14.5px; color:rgba(241,238,228,0.55); }
  .contact{ margin-top:28px; padding-top:22px; border-top:1px solid var(--line); font-size:14px; color:rgba(241,238,228,0.65); }
  .contact a{ color:var(--gold-2); text-decoration:none; font-weight:600; white-space:nowrap; }
  .contact a:hover{ text-decoration:underline; }
  .contact div{ margin:6px 0; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="images/logo.jpg" alt="Cabrera Elite Baseball Development">
    <div class="brand">CABRERA ELITE BASEBALL DEVELOPMENT</div>
    <h1>ESTAMOS EN<br>MANTENIMIENTO</h1>
    <p>Estamos haciendo mejoras en el sitio. Volvemos muy pronto.</p>
